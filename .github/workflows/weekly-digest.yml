name: Weekly Civic Digest & GitHub Pages RSS

on:
  schedule:
    # GitHub Actions cron uses UTC; run at both 10:00 UTC (6:00 AM EDT)
    # and 11:00 UTC (6:00 AM EST), gated to 06:00 America/New_York in scripts/run-weekly.ts
    - cron: "0 10 * * 5"
    - cron: "0 11 * * 5"

  workflow_dispatch:
    inputs:
      action:
        description: "Workflow mode"
        type: choice
        default: "weekly"
        options:
          - weekly
          - backfill
          - pages-only
      date:
        description: "Optional date override (YYYY-MM-DD)"
        required: false
        type: string
      skip_email:
        description: "Skip sending email on this run"
        type: boolean
        default: false
      force:
        description: "Force run even if already run today"
        type: boolean
        default: false

  push:
    branches:
      - main
      - master
    paths:
      - "digests/**"
      - "scripts/**"
      - ".github/workflows/weekly-digest.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-civic-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.run.outputs.ran }}
      should_publish: ${{ steps.prep.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Compute GitHub Pages public URL
        id: prep
        run: |
          if [ -n "${{ vars.PUBLIC_APP_URL }}" ]; then
            URL="${{ vars.PUBLIC_APP_URL }}"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            URL="https://${{ github.repository_owner }}.github.io"
          else
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "public_url=$URL" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Run weekly digest & email pipeline
        id: run
        if: ${{ github.event_name != 'push' && inputs.action != 'pages-only' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUBLIC_APP_URL: ${{ steps.prep.outputs.public_url }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS+=("--check-friday-et")
          fi
          if [ "${{ inputs.action }}" = "backfill" ]; then
            ARGS+=("--backfill")
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=("--date=${{ inputs.date }}")
          fi
          if [ "${{ inputs.skip_email }}" = "true" ]; then
            ARGS+=("--skip-email")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=("--force")
          fi
          node scripts/run-weekly.ts "${ARGS[@]}"

      - name: Commit updated digests, votes, roster, and RSS
        if: ${{ github.event_name != 'push' && steps.run.outputs.ran == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A digests/ votes.csv state.json roster.csv roster.md roster_changes.json schedule.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Weekly civic digest update ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No repository file changes to commit."
          fi

      - name: Build static GitHub Pages archive & RSS feed
        if: ${{ github.event_name == 'push' || inputs.action == 'pages-only' || steps.run.outputs.ran == 'true' }}
        env:
          PUBLIC_APP_URL: ${{ steps.prep.outputs.public_url }}
        run: node scripts/build-pages.ts

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' || inputs.action == 'pages-only' || steps.run.outputs.ran == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy_pages:
    needs: digest
    if: ${{ github.event_name == 'push' || inputs.action == 'pages-only' || needs.digest.outputs.ran == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
